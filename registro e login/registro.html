<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <title>ReadZone Registro</title>
    
</head>

<body>
    <main class="container">
        <form>
            <h1>Registro ReadZone</h1>
            <script>
            document.querySelector('form').addEventListener('submit', function(e) {
              e.preventDefault();
              const usuario = document.querySelector('input[placeholder="Usuário"]').value;
              const email = document.querySelector('input[placeholder="E-mail"]').value;
              const senha = document.querySelector('input[placeholder="Senha"]').value;
              const confirmar = document.querySelector('input[placeholder="Confirmar senha"]').value;

              if (senha !== confirmar) {
                alert('As senhas não coincidem!');
                return;
              }

              // Salva usuário no localStorage (simples, sem criptografia)
              localStorage.setItem('readzone_user', JSON.stringify({ usuario, email, senha }));
              alert('Conta criada! Faça login.');
              window.location.href = 'login.html';
            });
            </script>
            <div class="input-box">
                <input placeholder="Usuário" type="text">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input placeholder="E-mail" type="email">
                <i class="bx bxs-envelope"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
            </div>
            <div class="input-box">
                <input placeholder="Confirmar senha" type="password">
                <i class="bx bxs-lock"></i>
            </div>

            <button type="submit" class="register">Registrar</button>

            <div class="register-link">
                <p>Já possui uma conta? <a href="login.html">Login</a></p>
            </div>
        </form>
    </main>
</body>
