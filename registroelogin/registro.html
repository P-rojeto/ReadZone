<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="login.css" />
  <title>Cadastro - ReadZone</title>
</head>
<body>
  <main class="container">
    <form id="formRegistro">
      <h1>Cadastro ReadZone</h1>
      <div class="input-box">
        <input type="text" placeholder="Nome de usuário" required />
      </div>
      <div class="input-box">
        <input type="email" placeholder="E-mail" required />
      </div>
      <div class="input-box">
        <input type="password" placeholder="Senha" required />
      </div>
      <button type="submit" class="login">Cadastrar</button>
      <div class="register-link">
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </form>
  </main>
  <script>
    document.getElementById('formRegistro').addEventListener('submit', async function (e) {
      e.preventDefault();
      const inputs = document.querySelectorAll('.input-box input');
      const usuario = inputs[0].value;
      const email = inputs[1].value;
      const senha = inputs[2].value;
      try {
        const resposta = await fetch('http://localhost:3000/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, email, senha })
        });
        const dados = await resposta.json();
        if (resposta.ok) {
          alert(dados.mensagem);
          window.location.href = 'login.html';
        } else {
          alert(dados.erro);
        }
      } catch {
        alert('Erro ao conectar com o servidor.');
      }
    });
  </script>
</body>
</html>
