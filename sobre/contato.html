<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReadZone - Contato</title>
  <link rel="stylesheet" href="/links uteis/dois.css"/>
<style>
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #ffffff;
  margin: 0;
  padding: 0;
}

.site-header {
  background: #222;
  color: #ffffff;
  padding: 16px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px;
}

.logo-top {
  height: 48px;
  margin-right: 16px;
}

.site-title {
  font-size: 2rem;
  font-weight: bold;
  margin-right: auto;
  margin-left: 8px;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
  margin: 0;
  padding: 0;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 4px;
  transition: background 0.2s;
}

nav a.active, nav a:hover {
  background: #ff9800;
  color: #222;
}

main {
  max-width: 600px;
  margin: 40px auto 0 auto;
  padding: 24px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.07);
}

.contato-section h1 {
  font-size: 2rem;
  margin-bottom: 24px;
  color: #222;
}

.contato-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-weight: 500;
  color: #333;
}

.form-group input,
.form-group textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 1rem;
  resize: vertical;
  transition: border 0.2s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #ff9800;
  outline: none;
}

.cta-btn {
  background: #ff9800;
  color: #fff;
  border: none;
  padding: 12px 0;
  border-radius: 6px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.cta-btn:hover {
  background: #e68900;
}

.contato-info {
  margin-top: 24px;
  font-size: 1rem;
  color: #444;
}

.contato-info a {
  color: #ff9800;
  text-decoration: underline;
}

.main-footer {
  background: #222;
  color: #fff;
  text-align: center;
  padding: 18px 0;
  margin-top: 40px;
}

.footer-logo-wrap {
  vertical-align: middle;
}

.footer-logo {
  height: 22px;
  vertical-align: middle;
  margin: 0 4px;
}

@media (max-width: 700px) {
  .header-content, main {
    flex-direction: column;
    max-width: 98vw;
    padding: 10px;
  }
  .site-title {
    font-size: 1.3rem;
  }
  main {
    margin: 16px auto 0 auto;
  }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <img src="/imagens/símbolo.png" alt="ReadZone Logo" class="logo-top"/>
      <span class="site-title">ReadZone</span>
      <nav>
        <ul>
          <li><a href="/index.html">Início</a></li>
          <li><a href="/livros.html">Livros</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main>
    <section class="contato-section">
      <h1>Fale Conosco</h1>
      <form class="contato-form">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" required></textarea>
        </div>
        <button type="submit" class="cta-btn">Enviar</button>
      </form>
      <div class="contato-info">
        <p>Ou envie um email para <a href="mailto:contato@readzone.com">projetoreadzone@gmail.com</a></p>
      </div>
    </section>
  </main>
  <footer class="main-footer">
    <div>© 2025 <span class="footer-logo-wrap"><img src="/imagens/símbolo.png" class="footer-logo" alt="Logo ReadZone"/></span> ReadZone. Todos os direitos reservados.</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
