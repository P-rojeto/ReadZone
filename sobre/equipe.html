<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Equipe ReadZone</title>
  <link rel="stylesheet" href="/links uteis/dois.css"/>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    .site-header {
      background: #222;
      color: #ffffff;
      padding: 16px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .logo-top {
      height: 48px;
      margin-right: 16px;
    }

    .site-title {
      font-size: 2rem;
      font-weight: bold;
      margin-right: auto;
      margin-left: 8px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    nav a.active, nav a:hover {
      background: #ff9800;
      color: #222;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 32px 24px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: #002;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .team-list {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }

    .team-link {
      display: block;
      padding: 14px 32px;
      background: #fff;
      color: #23272f;
      border: 2px solid #ff9800;
      border-radius: 12px;
      font-size: 1.2rem;
      text-decoration: none;
      font-weight: 500;
      box-shadow: 0 2px 6px #0001;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }

    .team-link:hover {
      background: #ff9800;
      color: #fff;
      box-shadow: 0 4px#002;
    }

    .main-footer {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 18px 0;
      margin-top: 40px;
    }

    .footer-logo-wrap {
      vertical-align: middle;
    }

    .footer-logo {
      height: 22px;
      vertical-align: middle;
      margin: 0 4px;
    }

    @media (max-width: 700px) {
      .header-content, main {
        flex-direction: column;
        max-width: 98vw;
        padding: 10px;
      }

      .site-title {
        font-size: 1.3rem;
      }

      .team-link {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <img src="/imagens/símbolo.png" alt="ReadZone Logo" class="logo-top"/>
      <span class="site-title">ReadZone</span>
      <nav>
        <ul>
          <li><a href="/index.html">Início</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Nossa Equipe</h1>
    <div class="team-list">
      <a class="team-link" href="/sobre/matheus.html">Matheus Santiago</a>
      <a class="team-link" href="/sobre/nicolas.html">Nicollas Anderson</a>
      <a class="team-link" href="/sobre/jose.html">José Pedro</a>
    </div>
  </main>

  <footer class="main-footer">
    <div>© 2025 <span class="footer-logo-wrap"><img src="/imagens/símbolo.png" class="footer-logo" alt="Logo ReadZone"/></span> ReadZone. Todos os direitos reservados.</div>
  </footer>
</body>
</html>
